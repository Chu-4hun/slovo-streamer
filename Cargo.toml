[package]
name = "slovo"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
futures-util = "0.3.34"
kick-api = { git = "https://github.com/Chu-4hun/kick-api.git" }
reqwest = { version = "0.13.4", features = ["query", "form", "json"] }
rootcause = "0.13.0"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
twitch_highway = "0.5.2"
